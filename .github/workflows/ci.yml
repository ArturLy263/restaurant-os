name: CI

on:
  push:
    branches: [main, public-main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        # Throwaway credentials for the job-local database; not a secret.
        env:
          POSTGRES_USER: restaurant
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: restaurant_os
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U restaurant -d restaurant_os"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+psycopg://restaurant:ci-only-password@localhost:5432/restaurant_os_test
      # Database tests must run: an unreachable database or a skipped
      # database test fails the build.
      REQUIRE_TEST_DATABASE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-test.txt
            backend/constraints.txt

      - name: Install dependencies
        run: |
          python -m pip install -r backend/requirements-test.txt -c backend/constraints.txt
          python -m pip check

      - name: Unit tests (no database)
        # Pointed at a port nobody listens on, proving unit tests need no
        # PostgreSQL.
        env:
          TEST_DATABASE_URL: postgresql+psycopg://nobody:nothing@127.0.0.1:9/unreachable_test
        run: python -m pytest -m unit

      - name: A missing test database fails the run
        env:
          TEST_DATABASE_URL: postgresql+psycopg://nobody:nothing@127.0.0.1:9/unreachable_test
        run: |
          set +e
          python -m pytest -m integration -x
          status=$?
          set -e
          if [ "$status" -ne 1 ]; then
            echo "::error::Expected pytest exit code 1 (tests failed) without a database, got $status"
            exit 1
          fi
          echo "Run failed as required (exit code 1)."

      - name: Integration tests (PostgreSQL 16)
        run: python -m pytest -m integration

      - name: Migration round-trip and model consistency
        run: python -m pytest -m migrations

      - name: Every collected test ran in one of the steps above
        run: |
          set +e
          python -m pytest --collect-only -q -m "not unit and not integration and not migrations"
          status=$?
          set -e
          if [ "$status" -ne 5 ]; then
            echo "::error::Some tests are not marked unit, integration or migrations (exit code $status)"
            exit 1
          fi
