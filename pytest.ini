[pytest]
testpaths = backend/tests
pythonpath = backend
addopts = -ra --strict-markers --strict-config
# Every test gets exactly one of these, assigned in backend/tests/conftest.py
# from the fixtures it actually uses. Select with e.g. `pytest -m unit`.
markers =
    unit: needs no database (assigned automatically)
    integration: uses the PostgreSQL test database (assigned automatically)
    migrations: uses a disposable PostgreSQL database (assigned automatically)
