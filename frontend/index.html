<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0e1116" />
    <title>RestaurantOS Kitchen Display</title>
    <script>
      // Applies the cashier theme before the first render (no flash); see
      // src/theme/theme.ts, which owns these keys.
      (function () {
        var root = document.documentElement;
        var theme = "dark";
        try {
          if (window.localStorage.getItem("restaurantos.theme") === "light") theme = "light";
        } catch (error) {}
        root.setAttribute("data-theme", theme);
        try {
          if (window.sessionStorage.getItem("restaurantos.mode") === "cashier") {
            root.setAttribute("data-workspace", "cashier");
          }
        } catch (error) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
