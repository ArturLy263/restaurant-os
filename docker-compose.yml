services:
  postgres:
    image: postgres:16
    container_name: restaurant_os_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Local development only: published on the loopback interface, never on
    # the network. Production keeps PostgreSQL on a private network with no
    # published port (see docs/security.md).
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: